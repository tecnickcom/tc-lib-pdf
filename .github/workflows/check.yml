name: check

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

jobs:
  test-php:
    name: Test on php ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      #- name: Install pdfinfo
      #  run: sudo apt-get install -y poppler-utils
      - name: Use php ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          # curl and intl are composer 'suggest' entries and tidy guards a
          # HTMLTest case: without them those tests skip silently, which a
          # green build cannot distinguish from them having run.
          extensions: ctype, curl, filter, gd, hash, intl, json, mbstring, openssl, pcre, tidy, xml, zlib
          ini-values: display_errors=on, error_reporting=-1, zend.assertions=1
      - name: List php modules
        run: php -m
      - name: List php modules using "no php ini" mode
        run: php -m -n
      - name: Cache module
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/
          key: composer-${{ matrix.os }}-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.os }}-${{ matrix.php-version }}-
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: make deps
      - name: Install qpdf
        if: matrix.php-version == '8.4'
        run: sudo apt-get update && sudo apt-get install -y qpdf
      # The preflight matrix skips the veraPDF checks when the binary is absent, so a
      # failed download degrades to the qpdf structural checks instead of a red build.
      - name: Install veraPDF
        if: matrix.php-version == '8.4'
        continue-on-error: true
        env:
          VERAPDF_URL: https://software.verapdf.org/rel/1.30/verapdf-greenfield-1.30.2-installer.zip
          VERAPDF_SHA256: 6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl -sSL --retry 3 -o "${workdir}/verapdf.zip" "${VERAPDF_URL}"
          echo "${VERAPDF_SHA256}  ${workdir}/verapdf.zip" | sha256sum --check --status
          unzip -q "${workdir}/verapdf.zip" -d "${workdir}"
          installer="$(find "${workdir}" -name 'verapdf-izpack-installer-*.jar' | head -n 1)"
          cat > "${workdir}/auto.xml" <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>${HOME}/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac Software" selected="false"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar "${installer}" "${workdir}/auto.xml"
          "${HOME}/verapdf/verapdf" --version
          echo "${HOME}/verapdf" >> "${GITHUB_PATH}"
      - name: Run preflight
        if: matrix.php-version == '8.4'
        run: make preflight
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Audit dependencies for known advisories
        run: composer audit
      - name: Run all tests
        run: make qa-coverage
      #- name: Generate CSS renderability reports
      #  if: matrix.php-version == '8.4'
      #  run: |
      #    php resources/css/renderability_score.php \
      #      --corpus=test/fixtures/html/real_pages/corpus.json \
      #      --json=target/report/renderability-score.json \
      #      --markdown=target/report/renderability-score.md
      #    php resources/css/renderability_trend.php \
      #      --score=target/report/renderability-score.json \
      #      --history=target/report/renderability-trend.json \
      #      --markdown=target/report/renderability-trend.md \
      #      --sha=${{ github.sha }} \
      #      --ref=${{ github.ref_name }} \
      #      --run-id=${{ github.run_id }}
      #    cat target/report/renderability-score.md >> "$GITHUB_STEP_SUMMARY"
      #    cat target/report/renderability-trend.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CSS renderability reports
        if: matrix.php-version == '8.4'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: css-renderability-reports-${{ github.run_id }}
          path: |
            target/report/renderability-score.json
            target/report/renderability-score.md
            target/report/renderability-trend.json
            target/report/renderability-trend.md
      # make install, resources/autoload.php and the packaging descriptors are
      # what reaches RPM/DEB users; nothing else in CI touches them. Install into
      # a throwaway prefix and load the library through the shipped autoloader,
      # which only resolves in the installed layout.
      - name: Packaging smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          DESTDIR="$(mktemp -d)"
          make install DESTDIR="$DESTDIR"
          cat > "$DESTDIR/smoke.php" <<'SMOKE'
          <?php
          require \getenv('DESTDIR') . '/usr/share/php/Com/Tecnick/Pdf/autoload.php';
          foreach ([
              'Com\Tecnick\Pdf\Base',
              'Com\Tecnick\Pdf\CSS',
              'Com\Tecnick\Pdf\Cell',
              'Com\Tecnick\Pdf\Exception',
              'Com\Tecnick\Pdf\HTML',
              'Com\Tecnick\Pdf\JavaScript',
          ] as $class) {
              if (!\class_exists($class)) {
                  \fwrite(\STDERR, 'the installed autoloader cannot load ' . $class . \PHP_EOL);
                  exit(1);
              }
          }
          echo 'installed layout loads every class', \PHP_EOL;
          SMOKE
          DESTDIR="$DESTDIR" php "$DESTDIR/smoke.php"

      - name: Send coverage
        if: matrix.php-version == '8.4'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: php-${{ matrix.php-version }}-ubuntu-latest
          name: php-${{ matrix.php-version }}-ubuntu-latest

  test-lowest:
    name: Test lowest supported dependencies on php 8.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use php 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          coverage: none
          # curl and intl are composer 'suggest' entries and tidy guards a
          # HTMLTest case: without them those tests skip silently, which a
          # green build cannot distinguish from them having run.
          extensions: ctype, curl, filter, gd, hash, intl, json, mbstring, openssl, pcre, tidy, xml, zlib
          ini-values: display_errors=on, error_reporting=-1, zend.assertions=1
      - name: Cache module
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/
          key: composer-lowest-${{ hashFiles('composer.json') }}
          restore-keys: composer-lowest-
      # composer.lock is not committed, so the default install always resolves
      # to the top of every declared range. Pin the bottom of the ranges here.
      - name: Install lowest supported dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: composer update --prefer-lowest --prefer-stable --no-interaction
      - name: Run unit tests
        run: composer run test
