<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="210mm"
     height="297mm"
     viewBox="0 0 210 297"
     version="1.1">
  <title>SVG Style Cascade, Opacity, Units and Clipping Regression Showcase</title>
  <desc>Every case under test is drawn next to a reference shape painted
        directly in the expected form. A correct render shows each pair as two
        identical marks. A pair that differs, a hidden group that shows through,
        a stroke ladder with uneven rungs or a clip applied to the wrong shape
        marks a regression.</desc>

  <defs>
    <clipPath id="half">
      <rect x="0" y="0" width="20" height="40"/>
    </clipPath>
    <clipPath id="band">
      <rect x="0" y="0" width="40" height="10"/>
    </clipPath>
    <clipPath id="unused">
      <rect x="0" y="0" width="6" height="6"/>
    </clipPath>
    <clipPath id="tail">
      <rect x="16" y="273" width="10" height="10"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="210" height="297" fill="#ffffff"/>
  <rect x="6" y="6" width="198" height="285" fill="none" stroke="#18486b" stroke-width="0.6"/>

  <text x="12" y="16" font-family="Helvetica" font-size="6" fill="#18486b">SVG style cascade, opacity, units and clipping</text>
  <text x="12" y="22" font-family="Helvetica" font-size="3.4" fill="#4a6f8a">Each case sits next to its reference. The two must be identical.</text>
  <line x1="12" y1="25" x2="198" y2="25" stroke="#18486b" stroke-width="0.4"/>

  <!-- The style attribute outranks the presentation attribute. -->
  <text x="12" y="33" font-family="Helvetica" font-size="3.6" fill="#18486b">1. cascade: style beats the presentation attribute</text>

  <text x="12" y="39" font-family="Helvetica" font-size="3" fill="#4a6f8a">fill</text>
  <rect x="24" y="35" width="16" height="10" fill="#d6457b" style="fill:#0a6e46"/>
  <rect x="42" y="35" width="16" height="10" fill="#0a6e46"/>

  <text x="64" y="39" font-family="Helvetica" font-size="3" fill="#4a6f8a">stroke</text>
  <rect x="78" y="35" width="16" height="10" fill="none" stroke="#d6457b" stroke-width="1" style="stroke:#0a6e46"/>
  <rect x="96" y="35" width="16" height="10" fill="none" stroke="#0a6e46" stroke-width="1"/>

  <text x="118" y="39" font-family="Helvetica" font-size="3" fill="#4a6f8a">width</text>
  <rect x="132" y="35" width="16" height="10" fill="none" stroke="#0a6e46" stroke-width="0.3" style="stroke-width:1"/>
  <rect x="150" y="35" width="16" height="10" fill="none" stroke="#0a6e46" stroke-width="1"/>

  <text x="12" y="51" font-family="Helvetica" font-size="3" fill="#4a6f8a">empty</text>
  <rect x="24" y="47" width="16" height="10" fill="#6c63ff" style="fill: ;"/>
  <rect x="42" y="47" width="16" height="10" fill="#6c63ff"/>

  <text x="64" y="51" font-family="Helvetica" font-size="3" fill="#4a6f8a">inherit</text>
  <g fill="#6c63ff">
    <rect x="78" y="47" width="16" height="10" fill="#d6457b" style="fill:inherit"/>
  </g>
  <rect x="96" y="47" width="16" height="10" fill="#6c63ff"/>

  <text x="118" y="51" font-family="Helvetica" font-size="3" fill="#4a6f8a">unrelated</text>
  <rect x="136" y="47" width="16" height="10" fill="#6c63ff" style="stroke:#18486b;stroke-width:1"/>
  <rect x="154" y="47" width="16" height="10" fill="#6c63ff" stroke="#18486b" stroke-width="1"/>

  <!-- A fully transparent container paints nothing, subtree included. -->
  <text x="12" y="70" font-family="Helvetica" font-size="3.6" fill="#18486b">2. opacity: a transparent group hides its whole subtree</text>
  <text x="12" y="76" font-family="Helvetica" font-size="3" fill="#4a6f8a">Nothing below may cover the backdrop or the caption.</text>

  <rect x="12" y="80" width="186" height="22" fill="#e8f1f8"/>
  <text x="16" y="93" font-family="Helvetica" font-size="4.5" fill="#18486b">This caption must stay legible from edge to edge of the band.</text>

  <g opacity="0">
    <rect x="12" y="80" width="46" height="22" fill="#d6457b"/>
  </g>
  <g style="opacity:0">
    <rect x="58" y="80" width="46" height="22" fill="#d6457b"/>
  </g>
  <g opacity="0">
    <g>
      <rect x="104" y="80" width="46" height="22" fill="#d6457b"/>
    </g>
  </g>
  <rect x="150" y="80" width="24" height="22" fill="#d6457b" opacity="0"/>
  <rect x="174" y="80" width="24" height="22" fill="#d6457b" style="opacity:0"/>

  <!-- A px length is a user unit, so it scales with the viewBox. -->
  <text x="12" y="116" font-family="Helvetica" font-size="3.6" fill="#18486b">3. units: px is a user unit; every rung is 1.5 units wide</text>

  <g stroke="#18486b">
    <line x1="16" y1="122" x2="74" y2="122" stroke-width="1.5"/>
    <line x1="16" y1="128" x2="74" y2="128" stroke-width="1.5px"/>
    <line x1="16" y1="134" x2="74" y2="134" style="stroke-width:1.5px"/>
  </g>
  <text x="78" y="123" font-family="Helvetica" font-size="3" fill="#4a6f8a">stroke-width="1.5"</text>
  <text x="78" y="129" font-family="Helvetica" font-size="3" fill="#4a6f8a">stroke-width="1.5px"</text>
  <text x="78" y="135" font-family="Helvetica" font-size="3" fill="#4a6f8a">style="stroke-width:1.5px"</text>

  <text x="12" y="146" font-family="Helvetica" font-size="3" fill="#4a6f8a">These three rungs are absolute lengths and widen in step.</text>
  <g stroke="#0a6e46">
    <line x1="16" y1="151" x2="74" y2="151" stroke-width="1pt"/>
    <line x1="16" y1="157" x2="74" y2="157" stroke-width="0.5mm"/>
    <line x1="16" y1="163" x2="74" y2="163" stroke-width="0.4em"/>
  </g>
  <text x="78" y="152" font-family="Helvetica" font-size="3" fill="#4a6f8a">stroke-width="1pt"</text>
  <text x="78" y="158" font-family="Helvetica" font-size="3" fill="#4a6f8a">stroke-width="0.5mm"</text>
  <text x="78" y="164" font-family="Helvetica" font-size="3" fill="#4a6f8a">stroke-width="0.4em"</text>

  <text x="12" y="175" font-family="Helvetica" font-size="3" fill="#4a6f8a">A percentage alpha equals the same value as a number.</text>
  <rect x="16" y="179" width="26" height="12" fill="#6c63ff" opacity="50%"/>
  <rect x="46" y="179" width="26" height="12" fill="#6c63ff" opacity="0.5"/>
  <rect x="80" y="179" width="26" height="12" fill="#d6457b" fill-opacity="25%"/>
  <rect x="110" y="179" width="26" height="12" fill="#d6457b" fill-opacity="0.25"/>

  <!-- A clipPath applies only where it is referenced. -->
  <text x="12" y="205" font-family="Helvetica" font-size="3.6" fill="#18486b">4. clipping: a clipPath applies only where referenced</text>

  <text x="12" y="211" font-family="Helvetica" font-size="3" fill="#4a6f8a">on the shape</text>
  <g transform="translate(16 214)">
    <rect x="0" y="0" width="40" height="40" fill="#a8d5c2" clip-path="url(#half)"/>
    <rect x="0" y="0" width="20" height="40" fill="none" stroke="#0a6e46" stroke-width="0.4"/>
  </g>

  <text x="62" y="211" font-family="Helvetica" font-size="3" fill="#4a6f8a">on the group</text>
  <g transform="translate(66 214)">
    <g clip-path="url(#half)">
      <rect x="0" y="0" width="40" height="40" fill="#a8d5c2"/>
    </g>
    <rect x="0" y="0" width="20" height="40" fill="none" stroke="#0a6e46" stroke-width="0.4"/>
  </g>

  <text x="112" y="211" font-family="Helvetica" font-size="3" fill="#4a6f8a">second clipPath</text>
  <g transform="translate(116 214)">
    <rect x="0" y="0" width="40" height="40" fill="#bcd8ef" clip-path="url(#band)"/>
    <rect x="0" y="0" width="40" height="10" fill="none" stroke="#18486b" stroke-width="0.4"/>
  </g>

  <text x="162" y="211" font-family="Helvetica" font-size="3" fill="#4a6f8a">no reference</text>
  <g transform="translate(166 214)">
    <rect x="0" y="0" width="28" height="40" fill="#f4c7d8"/>
    <rect x="0" y="0" width="28" height="40" fill="none" stroke="#d6457b" stroke-width="0.4"/>
  </g>

  <text x="12" y="266" font-family="Helvetica" font-size="3" fill="#4a6f8a">A clipped shape does not hide the shapes that follow it: the first swatch is</text>
  <text x="12" y="270" font-family="Helvetica" font-size="3" fill="#4a6f8a">clipped to its left half, the rest are full, and an unresolved reference paints unclipped.</text>
  <rect x="16" y="273" width="20" height="10" fill="#6c63ff" clip-path="url(#tail)"/>
  <rect x="40" y="273" width="10" height="10" fill="#6c63ff"/>
  <rect x="64" y="273" width="20" height="10" fill="#0a6e46" clip-path="url(#missing)"/>
  <rect x="88" y="273" width="20" height="10" fill="#0a6e46"/>

  <line x1="12" y1="287" x2="198" y2="287" stroke="#18486b" stroke-width="0.4"/>
</svg>
